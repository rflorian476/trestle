services:
  - type: web
    name: trestle-live  # kept so the existing Render service + URL stay the same (app is branded Sawyer)
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Free tier has no persistent disk: data/ is wiped on every deploy/restart/spin-down (OK for testing)
      - key: DATA_DIR
        value: ./data
      # One-line index switch. Keep 0 while this temporary domain serves demo listings.
      # At launch, on the custom domain: SAWYER_INDEXABLE=1 and
      # SAWYER_BASE_URL=https://your-domain (origin only, no path).
      - key: SAWYER_INDEXABLE
        value: "0"
      - key: SAWYER_BASE_URL
        value: https://trestle-twjo.onrender.com
      # Set the value in the Render dashboard. Blueprint sync will not overwrite it.
      # Until a domain is verified on Resend, mail only delivers to the Resend account owner.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Sawyer <onboarding@resend.dev>"
