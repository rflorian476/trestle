*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
a{color:var(--link,var(--p));text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--font-d);line-height:1.15;margin:0 0 .4em}
p{margin:0 0 .8em}
img,svg{display:block}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-.2em}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:.86rem}.pad{padding:16px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--p);color:var(--p-ink);padding:8px 14px;border-radius:8px}.skip:focus{left:8px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-btn,var(--r-sm));border:1.5px solid var(--line-strong,var(--line));background:var(--surface);color:var(--ink);font:600 .95rem var(--font);cursor:pointer;text-decoration:none!important;white-space:nowrap;transition:transform .12s,background .15s,box-shadow .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--p);border-color:var(--p);color:var(--p-ink)}.btn.primary:hover{background:var(--p-h,var(--p));border-color:var(--p-h,var(--p))}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink,#111)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--surface2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.86rem}.btn.block{width:100%}

:root{--font:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;--font-d:var(--font);--bg:#fbfbfd;--surface:#fff;--surface2:#f3f4f8;--ink:#14151a;--muted:#5d6170;--line:#e7e8ee;--line-strong:#d5d7e0;--p:#1B3A5B;--p-h:#16304C;--p-ink:#fff;--p-bg:#E6ECF3;--p-txt:#16304C;--acc:#ff5a5f;--acc-ink:#fff;--good:#0f7a4f;--good-bg:#e6f6ee;--bad:#d42a3a;--bad-bg:#fdecee;--gold:#9a6200;--gold-bg:#fff4dc;--star:#f5a400;--r:18px;--r-sm:12px;--r-btn:12px;--shadow:0 1px 2px rgba(16,18,40,.04),0 4px 14px rgba(16,18,40,.05);--shadow-h:0 10px 30px rgba(16,18,40,.12);--ring:rgba((27,58,91),.2);--focus:#1B3A5B;--maxw:1240px;--m-land:#eef2ea;--m-water:#cfe3f5;--m-road:#fff;--m-wlabel:#7aa5c9}

:root{--font:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;--font-d:"Plus Jakarta Sans",ui-sans-serif,sans-serif;--bg:#ffffff;--surface:#fff;--surface2:#f4f4f6;--ink:#0b0b10;--muted:#5b5d6b;--line:#ebebf0;--line-strong:#d9d9e2;--p:#B5532F;--p-h:#9A4426;--p-ink:#fff;--p-bg:#F6E7DF;--p-txt:#9A4426;--acc:#1B3A5B;--r:20px;--r-sm:14px;--r-btn:999px;--shadow:0 1px 2px rgba(10,10,20,.05),0 6px 18px rgba(10,10,20,.06);--shadow-h:0 24px 60px -12px rgba(10,10,30,.22);--ring:rgba((181,83,47),.22);--focus:#B5532F;--maxw:1280px;--m-land:#f1f1f4;--m-water:#e6eefc;--m-road:#e3e6ef;--navy:#0b0b1e;--grad:linear-gradient(100deg,#B5532F,#1B3A5B 45%,#1B3A5B)}

body{word-spacing:.05em}html{overflow-x:clip}

.ecol{display:flex;flex-direction:column;gap:18px}.ec-b{margin-top:70px}

.fc-pro{padding:0;overflow:hidden}.fc-art{height:150px;overflow:hidden}.fc-art svg{width:100%;height:100%}.fc-b{padding:14px 16px 16px;display:grid;gap:4px}.fc-b b{font-size:1.02rem;letter-spacing:-.02em}.fc-meta{color:var(--muted);font-size:.84rem}.fc-tags{display:flex;gap:6px;margin-top:6px}.fc-tags i{font-style:normal;font-size:.72rem;font-weight:700;background:var(--p-bg);color:var(--p-txt);padding:3px 8px;border-radius:999px}

.fq-bar{height:6px;border-radius:9px;background:var(--surface2);margin:14px 0 10px;overflow:hidden}.fq-bar i{display:block;height:100%;width:72%;background:var(--grad);border-radius:9px;animation:load 3s ease-in-out infinite alternate}@keyframes load{from{width:30%}to{width:84%}}

 const roads=`<path class="m-road" d="M${proj(43.955,-86.452,W,H)} L${proj(44.244,-86.324,W,H)} L${proj(44.633,-86.234,W,H)} M${proj(44.244,-86.324,W,H)} L${proj(44.252,-85.401,W,H)} L${proj(44.661,-84.715,W,H)} M${proj(44.252,-85.401,W,H)} L${proj(44.763,-85.621,W,H)} L${proj(45.318,-85.258,W,H)} L${proj(45.373,-84.955,W,H)} M${proj(44.763,-85.621,W,H)} L${proj(44.734,-85.176,W,H)} L${proj(44.661,-84.715,W,H)}"/>`;
 const towns=Object.entries(ZIPS).filter(([z])=>["78704","85004","78613","85281","43215","33602","60614","30307","85201"].includes(z)).map(([z,[n,a,b]])=>{const[x,y]=proj(a,b,W,H);return`<g class="m-town"><circle cx="${x}" cy="${y}" r="2.5"/><text x="${x+6}" y="${y-5}">${n}</text></g>`}).join("");

function typeahead(inp,onPick,onEnter){if(!inp)return;const box=inp.closest(".ta")||inp.parentNode;const ul=document.createElement("ul");ul.className="ta-list";ul.id=inp.id+"-list";ul.setAttribute("role","listbox");ul.hidden=true;box.appendChild(ul);inp.setAttribute("role","combobox");inp.setAttribute("aria-autocomplete","list");inp.setAttribute("aria-expanded","false");inp.setAttribute("aria-controls",ul.id);let hl=-1,items=[];
